# Pulse ConfigMap
# Non-sensitive configuration for all Pulse components.
# Replace pulse.example.com with the hostname served by the ingress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-config
  namespace: pulse
  labels:
    app: pulse
data:
  DEBUG: "false"
  # pulse-web-service is required for the frontend's internal proxy hop.
  ALLOWED_HOSTS: "pulse.example.com,pulse-web-service,localhost,127.0.0.1"
  CSRF_TRUSTED_ORIGINS: "https://pulse.example.com"
  ENABLE_DOCS: "true"
  SECURE_SSL_REDIRECT: "true"
  TRUST_X_FORWARDED_PROTO: "true"

  # Database (host only - credentials in secrets)
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "pulse"

  # Redis/Celery
  REDIS_URL: "redis://redis-service:6379/0"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/0"

  # Email (replace with your SMTP relay)
  EMAIL_HOST: "smtp.example.com"
  EMAIL_PORT: "587"
  EMAIL_USE_TLS: "true"
  DEFAULT_FROM_EMAIL: "pulse@example.com"

  # Push: use FCM with workload identity/application default credentials, or
  # set "console" only for a simulation-only deployment.
  PUSH_BACKEND: "fcm"
