# Pulse frontend (Next.js console and same-origin API proxy)
# The browser never talks to Django directly; this service forwards /api/* to
# pulse-web-service and holds JWTs in httpOnly cookies.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-frontend
  namespace: pulse
  labels:
    app: pulse
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pulse
      component: frontend
  template:
    metadata:
      labels:
        app: pulse
        component: frontend
    spec:
      containers:
        - name: frontend
          image: pulse-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND_INTERNAL_URL
              value: "http://pulse-web-service:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: pulse-frontend-service
  namespace: pulse
  labels:
    app: pulse
    component: frontend
spec:
  selector:
    app: pulse
    component: frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulse-frontend-hpa
  namespace: pulse
  labels:
    app: pulse
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulse-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
