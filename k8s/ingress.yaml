# Ingress Configuration
# Routes browser traffic to the Next.js frontend, which proxies /api/* to
# Django from inside the cluster. Admin and static files go directly to Django.
# Requires an Ingress Controller (nginx-ingress, traefik, etc.).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-ingress
  namespace: pulse
  labels:
    app: pulse
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    # For cert-manager TLS (optional)
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  # Uncomment for TLS
  # tls:
  #   - hosts:
  #       - pulse.example.com
  #     secretName: pulse-tls
  rules:
    - host: pulse.example.com # Replace with your domain
      http:
        paths:
          # Django admin and its static assets.
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: pulse-web-service
                port:
                  number: 80
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: pulse-web-service
                port:
                  number: 80
          # Everything else, including /api/* and /api/docs/, goes through the
          # frontend's same-origin proxy and httpOnly cookie session.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-frontend-service
                port:
                  number: 80
