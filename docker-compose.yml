services:
  web:
    build:
      context: .
      network: host
    network_mode: "host"
    command: gunicorn pulse.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env

  db:
    image: postgres:16
    network_mode: "host"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=pulse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  redis:
    image: redis:7
    network_mode: "host"

  celery:
    build:
      context: .
      network: host
    network_mode: "host"
    command: celery -A pulse worker -l info --logfile=/app/logs/celery.log -Q high_priority,low_priority
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env

  celery-beat:
    build:
      context: .
      network: host
    network_mode: "host"
    command: celery -A pulse beat -l info
    volumes:
      - .:/app
      - ./logs:/app/logs
    env_file:
      - .env

  flower:
    build:
      context: .
      network: host
    network_mode: "host"
    command: celery -A pulse flower --port=5555
    volumes:
      - .:/app
    env_file:
      - .env

  mailpit:
    image: axllent/mailpit:latest
    network_mode: "host"

  dashboard:
    build:
      context: .
      network: host
    network_mode: "host"
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    volumes:
      - .:/app
    env_file:
      - .env

  metrics:
    build:
      context: .
      network: host
    network_mode: "host"
    command: python dashboard/metrics.py
    volumes:
      - .:/app
    env_file:
      - .env

volumes:
  postgres_data:
