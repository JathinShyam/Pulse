# Local, self-contained Pulse stack.
#
#   cp .env.example .env   # then set SECRET_KEY and PULSE_API_KEYS
#   docker compose up --build
#
# The Next.js frontend is the browser entry point at http://localhost:3000.
# Django, Redis, PostgreSQL, Mailpit, Flower and the Streamlit dashboard stay on
# the internal network. Only explicitly published ports are reachable.

x-backend-env: &backend-env
  DEBUG: "${DEBUG:-false}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}"
  SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-false}"
  TRUST_X_FORWARDED_PROTO: "${TRUST_X_FORWARDED_PROTO:-false}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
  CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-false}"
  # Local HTTP must not send HSTS, or browsers will force HTTPS for localhost
  # on every port after the first API response.
  SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}"
  SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-false}"
  ENABLE_DOCS: "${ENABLE_DOCS:-true}"
  ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-false}"
  DATABASE_URL: "${COMPOSE_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/pulse}"
  REDIS_URL: "${COMPOSE_REDIS_URL:-redis://redis:6379/0}"
  CELERY_BROKER_URL: "${COMPOSE_CELERY_BROKER_URL:-redis://redis:6379/0}"
  CELERY_RESULT_BACKEND: "${COMPOSE_CELERY_RESULT_BACKEND:-redis://redis:6379/0}"
  EMAIL_HOST: "${COMPOSE_EMAIL_HOST:-mailpit}"
  EMAIL_PORT: "${COMPOSE_EMAIL_PORT:-1025}"
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-false}"
  DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-pulse@local.dev}"
  PUSH_BACKEND: "${PUSH_BACKEND:-console}"
  SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
  PULSE_API_KEYS: "${PULSE_API_KEYS:-}"

x-backend: &backend
  image: pulse-backend:local
  build:
    context: .
  env_file:
    - .env
  environment: *backend-env
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "manage.py", "migrate_locked"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery:
    <<: *backend
    command:
      [
        "celery",
        "-A",
        "pulse",
        "worker",
        "-l",
        "INFO",
        "-Q",
        "high_priority,low_priority",
        "--concurrency=2",
      ]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-beat:
    <<: *backend
    command: ["celery", "-A", "pulse", "beat", "-l", "INFO"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  flower:
    <<: *backend
    command: ["celery", "-A", "pulse", "flower", "--port=5555"]
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  dashboard:
    <<: *backend
    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
      ]
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  metrics:
    <<: *backend
    command: ["python", "dashboard/metrics.py"]
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: pulse-frontend:local
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_APP_VERSION: "${PULSE_VERSION:-1.1.0}"
        NEXT_PUBLIC_ENVIRONMENT: "${NEXT_PUBLIC_ENVIRONMENT:-Self-hosted}"
        NEXT_PUBLIC_API_DOCS_URL: "/api/docs/"
    environment:
      BACKEND_INTERNAL_URL: "http://web:8000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
