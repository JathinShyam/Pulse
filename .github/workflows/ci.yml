name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements/*.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt -r requirements/production.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: pulse.settings
          SECRET_KEY: ci-only-8vN4xQ2rT7wK9mP3sL6cH1jB5fD0aG4eU8yR2iO7pZ3nM6vC9kX5qW1tS0bJ
          DEBUG: "False"
          DATABASE_URL: "sqlite:///:memory:"
          ENABLE_DOCS: "True"
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        env:
          DJANGO_SETTINGS_MODULE: pulse.settings
          SECRET_KEY: ci-only-8vN4xQ2rT7wK9mP3sL6cH1jB5fD0aG4eU8yR2iO7pZ3nM6vC9kX5qW1tS0bJ
          DEBUG: "False"
          DATABASE_URL: "sqlite:///:memory:"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
        run: python manage.py check --deploy --fail-level WARNING

      - name: Test
        env:
          DJANGO_SETTINGS_MODULE: pulse.settings
          SECRET_KEY: ci-only-8vN4xQ2rT7wK9mP3sL6cH1jB5fD0aG4eU8yR2iO7pZ3nM6vC9kX5qW1tS0bJ
          DEBUG: "False"
          DATABASE_URL: "sqlite:///:memory:"
          PULSE_API_KEYS: "ci-api-key"
          ENABLE_DOCS: "True"
        run: python manage.py test -v 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production bundle
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_VERSION: "1.1.0"
          NEXT_PUBLIC_ENVIRONMENT: "CI"
          NEXT_PUBLIC_API_DOCS_URL: "/api/docs/"
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: pulse-api:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_APP_VERSION=1.1.0
            NEXT_PUBLIC_ENVIRONMENT=CI
            NEXT_PUBLIC_API_DOCS_URL=/api/docs/
          tags: pulse-frontend:latest
